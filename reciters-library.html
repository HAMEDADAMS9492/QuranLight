<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma Bibliothèque | QuranLight</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri&family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/theme-variables.css" />

    <style>
      :root {
        --color-gold: #b08d57;
        --color-gold-light: #d4bc96;
        --color-emerald-deep: #05140f;
        --color-emerald-light: #0d3a27;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      ::-webkit-scrollbar { display: none; }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--color-emerald-deep);
        color: #ffffff;
        min-height: 100vh;
        overflow-x: hidden;
        scrollbar-width: none;
      }

      /* --- HEADER PREMIUM --- */
      .reciters-header {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: rgba(5, 20, 15, 0.9);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        padding: 15px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        border-bottom: 1px solid rgba(176, 141, 87, 0.2);
      }

      .back-btn {
        width: 40px;
        color: var(--color-gold);
        font-size: 1.3rem;
        cursor: pointer;
        transition: var(--transition);
      }
      .back-btn:active { transform: scale(0.9); }

      .header-title {
        text-align: center;
        flex-grow: 1;
      }
      .header-title h1 {
        font-size: 0.9rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #fff;
      }

      /* --- BARRE DE RECHERCHE --- */
      .search-wrapper {
        padding: 15px 20px;
        width: 100%;
      }
      .search-box {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(176, 141, 87, 0.2);
        border-radius: 12px;
        padding: 12px 15px;
        display: flex;
        align-items: center;
        transition: var(--transition);
      }
      .search-box:focus-within {
        border-color: var(--color-gold);
        background: rgba(255, 255, 255, 0.08);
      }
      .search-box i {
        color: var(--color-gold);
        margin-right: 10px;
        opacity: 0.6;
        flex-shrink: 0;
      }
      .search-box input {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 0.95rem;
        width: 100%;
        outline: none;
      }
      .search-box input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      /* --- CONTENEURS DE LISTE --- */
      .reciters-container,
      .surah-list {
        width: 100%;
        padding: 0 20px 100px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* --- CARTES --- */
      .item-card {
        display: flex;
        align-items: center;
        padding: 15px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        cursor: pointer;
        transition: var(--transition);
        width: 100%;
      }
      .item-card:hover {
        background: rgba(176, 141, 87, 0.08);
        border-color: var(--color-gold);
        transform: translateY(-2px);
      }
      .item-card:active { transform: scale(0.98); }

      /* --- NUMÉRO DE SOURATE --- */
      .num-badge {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-gold-light);
        font-size: 0.75rem;
        font-weight: 800;
        margin-right: 15px;
        flex-shrink: 0;
        border: 1px solid rgba(176, 141, 87, 0.1);
      }

      /* --- AVATAR RÉCITATEUR --- */
      .reciter-avatar-box {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        margin-right: 15px;
        flex-shrink: 0;
        overflow: hidden;
        border: 1px solid var(--color-gold);
      }
      .reciter-avatar-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* --- ZONE DE TEXTE --- */
      .info-zone {
        flex-grow: 1;
        overflow: hidden;
      }
      .title-fr {
        display: block;
        font-size: 1rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sub-meta {
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 500;
      }
      .title-ar {
        font-family: "Amiri", serif;
        font-size: 1.2rem;
        color: var(--color-gold-light);
        text-align: right;
        margin-left: 10px;
        flex-shrink: 0;
      }
      .chevron-icon {
        color: var(--color-gold);
        font-size: 0.8rem;
        margin-left: 10px;
        flex-shrink: 0;
      }

      /* --- PANEL SOURATES (MODAL) --- */
      #surahPanel {
        position: fixed;
        inset: 0;
        background: var(--color-emerald-deep);
        z-index: 2000;
        display: none;
        flex-direction: column;
        width: 100%;
      }

      .surah-list {
        overflow-y: auto;
        padding-top: 10px;
        flex: 1;
      }

      /* État actif (lecture en cours) */
      .active-row {
        border-color: var(--color-gold) !important;
        background: rgba(176, 141, 87, 0.12) !important;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      /* Animation d'entrée du panel */
      @keyframes slideUp {
        from { transform: translateY(100%); }
        to   { transform: translateY(0); }
      }
      .panel-animate {
        animation: slideUp 0.4s cubic-bezier(0, 0, 0.2, 1);
      }
    </style>
  </head>

  <body>
    <!-- HEADER PRINCIPAL -->
    <header class="reciters-header">
      <div class="back-btn" onclick="window.location.href='index.html'">
        <i class="fas fa-arrow-left"></i>
      </div>
      <div class="header-title"><h1>Ma Bibliothèque</h1></div>
      <div style="width: 40px"></div>
    </header>

    <!-- RECHERCHE RÉCITATEURS -->
    <div class="search-wrapper">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input
          type="text"
          id="searchInput"
          placeholder="Chercher un récitateur..."
          oninput="filterReciters()"
        />
      </div>
    </div>

    <!-- LISTE DES RÉCITATEURS -->
    <main class="reciters-container" id="recitersList"></main>

    <!-- PANEL SOURATES -->
    <div id="surahPanel">
      <header class="reciters-header">
        <div class="back-btn" onclick="closePanel()">
          <i class="fas fa-times"></i>
        </div>
        <div class="header-title">
          <h1 id="selectedName">Chargement...</h1>
        </div>
        <div style="width: 40px"></div>
      </header>

      <div class="search-wrapper">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="surahSearchInput"
            placeholder="Chercher une sourate..."
            oninput="filterSurahs()"
          />
        </div>
      </div>

      <div class="surah-list" id="surahContent"></div>
    </div>

    <script>
      // --- DONNÉES ---
      const recitersData = [
        { id: "ar.abdulbasitmurattal", name: "Abd Al-Basit",          ar: "عبد الباسط عبد الصمد",  img: "assets/image/basit.jpg"   },
        { id: "ar.sudais",             name: "Abdurrahman Al-Sudais", ar: "عبد الرحمن السديس",      img: "assets/image/sudais.jpg"  },
        { id: "ar.alafasy",            name: "Mishary Alafasy",       ar: "مشاري العفاسي",          img: "assets/image/mishary.jpg" },
        { id: "ar.hanirifai",          name: "Hani Al-Rifai",         ar: "هاني الرفاعي",           img: "assets/image/hani.jpg"    },
        { id: "ar.shatri",             name: "Abu Bakr Al-Shatri",    ar: "أبو بكر الشاطري",        img: "assets/image/shatri.jpg"  },
        { id: "ar.basfar",             name: "Abdullah Basfar",       ar: "عبد الله بصفر",          img: "assets/image/basfar.jpg"  },
      ];

      const audioServers = {
        "ar.abdulbasitmurattal": "https://server7.mp3quran.net/basit/murattal",
        "ar.sudais":             "https://server11.mp3quran.net/sds",
        "ar.alafasy":            "https://server8.mp3quran.net/afs",
        "ar.hanirifai":          "https://server8.mp3quran.net/hani",
        "ar.shatri":             "https://server11.mp3quran.net/shatri",
        "ar.basfar":             "https://server6.mp3quran.net/bsfr",
      };

      // Données normalisées : { n, en, ar, t, v }
      let allSurahsData = [];
      let currentReciterId = "";
      let currentReciterName = "";

      // --- INITIALISATION ---
      document.addEventListener("DOMContentLoaded", async () => {
        renderReciters(recitersData);
        await loadSurahsData();

        // Auto-ouvrir si redirigé depuis une autre page avec un récitateur ciblé
        const tId = localStorage.getItem("targetReciterId");
        const tNm = localStorage.getItem("targetReciterName");
        if (tId && tNm) {
          openSurahs(tId, tNm);
          localStorage.removeItem("targetReciterId");
          localStorage.removeItem("targetReciterName");
        }
      });

      // --- CHARGEMENT API ---
      async function loadSurahsData() {
        try {
          const res = await fetch("https://api.alquran.cloud/v1/surah");
          const data = await res.json();
          if (data && data.data) {
            allSurahsData = data.data.map((s) => ({
              n: s.number,
              en: s.englishName,
              ar: s.name,
              t: s.revelationType === "Meccan" ? "Mecquoise" : "Médinoise",
              v: s.numberOfAyahs,
            }));
          }
        } catch (e) {
          console.error("Erreur API sourates:", e);
        }
      }

      // --- AFFICHAGE RÉCITATEURS ---
      function renderReciters(list) {
        const container = document.getElementById("recitersList");
        if (!container) return;
        container.innerHTML = list
          .map(
            (r) => `
          <div class="item-card" onclick="openSurahs('${r.id}', '${r.name.replace(/'/g, "\\'")}')">
            <div class="reciter-avatar-box">
              <img src="${r.img}" alt="${r.name}" loading="lazy"
                   onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(r.name)}&background=0d3a27&color=b08d57'">
            </div>
            <div class="info-zone">
              <span class="title-fr">${r.name}</span>
              <span class="sub-meta">${r.ar}</span>
            </div>
            <i class="fas fa-chevron-right chevron-icon"></i>
          </div>`
          )
          .join("");
      }

      // --- OUVERTURE DU PANEL SOURATES ---
      function openSurahs(id, name) {
        currentReciterId = id;
        currentReciterName = name;

        const panel = document.getElementById("surahPanel");
        const nameEl = document.getElementById("selectedName");

        if (nameEl) nameEl.textContent = name;
        if (panel) {
          panel.style.display = "flex";
          panel.classList.add("panel-animate");
          panel.addEventListener(
            "animationend",
            () => panel.classList.remove("panel-animate"),
            { once: true }
          );
        }

        if (allSurahsData.length > 0) {
          renderSurahList(allSurahsData);
        } else {
          const content = document.getElementById("surahContent");
          if (content)
            content.innerHTML =
              '<p style="text-align:center;padding:40px;color:rgba(255,255,255,0.4)">Chargement des sourates...</p>';
        }
      }

      // --- FERMETURE DU PANEL ---
      function closePanel() {
        const panel = document.getElementById("surahPanel");
        if (panel) panel.style.display = "none";
      }

      // --- AFFICHAGE LISTE SOURATES ---
      function renderSurahList(list) {
        const content = document.getElementById("surahContent");
        if (!content) return;

        if (!list || list.length === 0) {
          content.innerHTML =
            '<p style="text-align:center;padding:40px;color:rgba(255,255,255,0.4)">Aucun résultat.</p>';
          return;
        }

        content.innerHTML = list
          .map(
            (s) => `
          <div class="item-card" onclick="selectAudio('${currentReciterId}', ${s.n}, '${currentReciterName.replace(/'/g, "\\'")}', '${s.en.replace(/'/g, "\\'")}')">
            <div class="num-badge">${s.n}</div>
            <div class="info-zone">
              <span class="title-fr">${s.en}</span>
              <span class="sub-meta">${s.t} • ${s.v} versets</span>
            </div>
            <div class="title-ar">${s.ar}</div>
          </div>`
          )
          .join("");
      }

      // --- SÉLECTION ET REDIRECTION PLAYER ---
      function selectAudio(reciterId, surahNum, reciterName, surahName) {
        const padded = surahNum.toString().padStart(3, "0");
        const audioUrl = audioServers[reciterId]
          ? `${audioServers[reciterId]}/${padded}.mp3`
          : `https://cdn.islamic.network/quran/audio-surah/128/${reciterId}/${surahNum}.mp3`;

        const reciter = recitersData.find((r) => r.id === reciterId);

        localStorage.setItem("player_url", audioUrl);
        localStorage.setItem("player_title", surahName);
        localStorage.setItem("player_artist", reciterName);
        localStorage.setItem("player_img", reciter ? reciter.img : "assets/image/Logo.jpg");
        localStorage.setItem("currentReciterId", reciterId);
        localStorage.setItem("currentReciterName", reciterName);
        localStorage.setItem("currentSurahNum", surahNum);

        window.location.href = "player.html";
      }

      // --- FILTRES DE RECHERCHE ---
      function filterReciters() {
        const q = document.getElementById("searchInput").value.toLowerCase();
        const filtered = recitersData.filter(
          (r) => r.name.toLowerCase().includes(q) || r.ar.includes(q)
        );
        renderReciters(filtered);
      }

      function filterSurahs() {
        const q = document.getElementById("surahSearchInput").value.toLowerCase();
        const filtered = allSurahsData.filter(
          (s) =>
            s.en.toLowerCase().includes(q) ||
            s.n.toString().includes(q) ||
            s.ar.includes(q)
        );
        renderSurahList(filtered);
      }
    </script>

    <script src="assets/js/script.js" defer></script>
    <script src="assets/js/theme-loader.js" defer></script>
  </body>
</html>
